id: PB-CREDENTIAL-01
title: Credential theft or brute force
description: Confirm whether a guessed or stolen credential was used and cut off the access.
trigger:
  attack: [T1110, T1110.003, T1078, T1003]
  rules: [DFIR-WIN-0003, DFIR-WIN-0004, DFIR-WIN-0005, DFIR-LNX-0001, DFIR-LNX-0002]
phases:
  - name: Triage
    steps:
      - { id: t1, text: "Confirm a successful logon followed the failures (source, account, time)", manual: true }
      - { id: t2, text: "List every system the account touched after the first success", manual: true }
  - name: Containment
    steps:
      - { id: c1, text: "Disable the affected account", action: agent.disable_account }
      - { id: c2, text: "Block the source addresses at the perimeter", manual: true }
      - { id: c3, text: "Notify the response team", action: notify.team }
  - name: Evidence
    steps:
      - { id: e1, text: "Collect authentication logs from the targeted systems", action: agent.collect_triage }
  - name: Recovery
    steps:
      - { id: r1, text: "Reset the password, revoke sessions and tokens, enforce MFA", manual: true }
notify: { channels: [in_app], roles: [lead] }
