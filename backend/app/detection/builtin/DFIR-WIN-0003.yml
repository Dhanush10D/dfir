id: DFIR-WIN-0003
title: Possible brute-force logons
status: stable
level: medium
attack: [T1110]
description: At least 10 failed logons (4625) from one source IP within 5 minutes.
logsource: { source_type: evtx, channel: Security }
detection:
  selection: { event_code: "4625" }
  group_by: [src_ip]
  threshold: { count: 10, window: 5m }
  condition: selection
false_positives: ["Misconfigured service or scheduled task with a stale password"]
