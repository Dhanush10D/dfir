id: DFIR-LNX-0001
title: SSH brute force
status: stable
level: medium
attack: [T1110]
description: At least 10 failed SSH authentications from one source IP within 5 minutes.
logsource: { source_type: [auth_log, syslog] }
detection:
  selection: { event_code: [ssh_failed, ssh_max_auth] }
  group_by: [src_ip]
  threshold: { count: 10, window: 5m }
  condition: selection
false_positives: ["Internet-facing SSH receives constant background scanning"]
