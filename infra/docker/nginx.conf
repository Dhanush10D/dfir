# Served by nginx-unprivileged (port 8080, non-root). Dev config; TLS terminates at a proxy in front
# of this container in production (docs/hardening.md).
#
# Security headers come from one include file (security-headers.conf, Phase 10): nginx drops
# server-level add_header directives in any location that declares its own add_header, so every
# location either declares none (and inherits) or includes the same file again.
# Only /api/ is proxied: the API's /metrics endpoint is not reachable through this container.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;  # evidence uploads stream through to the API (limits enforced there)

    # Trusted proxies in front of this container (none by default): with a TLS proxy, list it
    # there so $remote_addr (and the API's per-IP login limit) is the real client.
    include /etc/nginx/snippets/real-ip.conf;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx is the edge: overwrite (not append) so clients cannot inject a fake hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        # index.html must not be cached: a new deploy changes the hashed asset names.
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
