# Trusted reverse proxies in front of the web container (docs/hardening.md, "Authentication limits").
#
# Default: none. nginx is the edge, and $remote_addr is the TCP peer, so a client cannot claim
# another address with its own X-Forwarded-For header.
#
# If a TLS terminator or load balancer sits in front of this container, every request reaches
# nginx from that proxy. The per-IP login limit would then put every user in one bucket, and one
# client could lock everyone out. List the proxy's address here, then mount the file with
# WEB_REAL_IP_CONF=/path/to/real-ip.conf (compose). nginx then takes the client address from the
# proxy's X-Forwarded-For header, and only when the request really comes from that proxy:
#
#   set_real_ip_from 10.0.0.5;        # the TLS proxy (address or CIDR); one line per proxy
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;             # skip every trusted hop, keep the first untrusted one
