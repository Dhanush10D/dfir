# Security headers for every response of the web container (included by nginx.conf).
#
# nginx drops inherited add_header directives in a location that declares its own add_header, so
# nginx.conf includes this file at server level AND in every location that adds a header. One file
# keeps the copies identical (Phase 10; scripts/phase4-smoke.py and phase10-smoke.py check every
# location). CSP: scripts and styles only from this origin (no inline), no plugins, no framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
