# dfirbench Standard profile: single-node development stack (guide 21.1).
# DEV ONLY: passwords below are placeholder defaults; APP_ENV=prod refuses them. Override via a
# repo-root .env (copy .env.example) or `docker compose --env-file`.
#
#   docker compose -f infra/compose.yaml up -d --build
#
# Host ports bind to 127.0.0.1 only.

name: dfirbench

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://dfir:${POSTGRES_PASSWORD:-dfir_dev_password}@postgres:5432/dfirbench
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dfir}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
  S3_SECURE: "false"
  VAULT_BUCKET: ${VAULT_BUCKET:-evidence}
  ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-artifacts}
  VAULT_RETENTION_DAYS: ${VAULT_RETENTION_DAYS:-3650}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  # Every app session runs as the least-privilege role from migration 0002 (no UPDATE/DELETE on
  # custody_log/audit_log). Alembic (migrate) connects without it.
  DATABASE_APP_ROLE: dfirbench_app
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
  TOTP_ENC_KEY: ${TOTP_ENC_KEY:-dev-only-totp-key-change-me}
  # Dev custody signing key, generated once by the keygen job into the custodykeys volume.
  CUSTODY_SIGNING_KEY_PATH: /var/lib/dfirbench/keys/custody-dev.pem
  CUSTODY_KEY_ID: ${CUSTODY_KEY_ID:-}
  # Retired/other trusted custody public keys (JSON {key_id: PEM}); empty = only the signer.
  CUSTODY_TRUSTED_KEYS_PATH: ${CUSTODY_TRUSTED_KEYS_PATH:-}

x-backend-build: &backend-build
  context: ../backend
  dockerfile: ../infra/docker/api.Dockerfile

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: dfirbench
      POSTGRES_USER: dfir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfir_dev_password}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfir -d dfirbench"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Upstream minio/minio images are no longer published; pgsty/minio is a maintained
    # community build of the same AGPLv3 server. Any S3-compatible store with Object Lock works.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dfir}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    volumes: ["miniodata:/data"]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # Image has no curl/wget/mc; probe the unauthenticated liveness endpoint with bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r line <&3 && [[ $$line == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the WORM vault bucket (Object Lock) and the artifacts bucket.
  storage-init:
    image: dfirbench/api:dev
    build: *backend-build
    command: ["python", "-m", "app.storage", "init"]
    environment: *backend-env
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  # One-shot: create the dev Ed25519 custody signing key if it does not exist yet (never
  # overwritten; lives only in the custodykeys volume, never in the repository).
  keygen:
    image: dfirbench/api:dev
    build: *backend-build
    command: ["python", "-m", "app.core.signing", "generate", "--out", "/var/lib/dfirbench/keys/custody-dev.pem", "--if-missing"]
    volumes: ["custodykeys:/var/lib/dfirbench/keys"]
    restart: "no"

  # One-shot: apply Alembic migrations before the API starts.
  migrate:
    image: dfirbench/api:dev
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: dfirbench/api:dev
    build: *backend-build
    environment:
      <<: *backend-env
      # uvicorn trusts X-Forwarded-For only from the nginx (web) container, so audit rows get the
      # real client IP while direct callers on :8000 cannot spoof it.
      FORWARDED_ALLOW_IPS: ${WEB_IP:-172.30.240.10}
    volumes: ["custodykeys:/var/lib/dfirbench/keys:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    image: dfirbench/worker:dev
    build:
      context: ../backend
      dockerfile: ../infra/docker/worker.Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,parse,ai,reports", "-c", "2", "-n", "worker@%h", "--loglevel", "INFO"]
    environment:
      <<: *backend-env
      # Per-job scratch copies of evidence (0400, deleted after each job): a disk volume, not tmpfs.
      SCRATCH_DIR: /var/lib/dfirbench/scratch
    volumes: ["custodykeys:/var/lib/dfirbench/keys:ro", "scratch:/var/lib/dfirbench/scratch"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # Dev shortcut. In production each parser job runs in its own sandbox container with
    # --network none and a read-only evidence mount (guide 10.7, 21.1; Phase 10).
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 20s

  web:
    image: dfirbench/web:dev
    build:
      context: ../frontend
      dockerfile: ../infra/docker/web.Dockerfile
      additional_contexts:
        infra: ./docker
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    networks:
      default:
        ipv4_address: ${WEB_IP:-172.30.240.10}
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  default:
    # Fixed subnet so the web container has a stable address to trust (FORWARDED_ALLOW_IPS).
    # Override WEB_SUBNET/WEB_IP in .env if this range collides with a local network.
    ipam:
      config:
        - subnet: ${WEB_SUBNET:-172.30.240.0/24}

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  custodykeys: {}
  scratch: {}
