name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: dfirbench
          POSTGRES_USER: dfir
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dfir -d dfirbench"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://dfir:ci_test_password@127.0.0.1:5432/dfirbench
      TEST_DATABASE_URL: postgresql+psycopg://dfir:ci_test_password@127.0.0.1:5432/dfirbench
      REDIS_URL: redis://127.0.0.1:6379/0
      # MinIO for the Object Lock vault integration tests (they skip if it is unreachable).
      S3_ENDPOINT: 127.0.0.1:9000
      S3_ACCESS_KEY: dfir
      S3_SECRET_KEY: ci_minio_password
    steps:
      - uses: actions/checkout@v5
      - name: Start MinIO
        # Service containers cannot pass `server /data`, so run it directly.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dfir -e MINIO_ROOT_PASSWORD=ci_minio_password \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Bandit
        run: bandit -c pyproject.toml -r app -q
      - name: Alembic upgrade + drift check
        run: alembic upgrade head && alembic check
      - name: Pytest (unit + integration)
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose -f infra/compose.yaml up -d --build
      - name: Wait for healthy services
        run: bash scripts/wait-healthy.sh 300
      - name: Probe endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/api/v1/ready
          curl -fsS http://127.0.0.1:8080/api/v1/health
      - name: Phase 1 live smoke + tamper demo
        run: |
          export DFIR_ADMIN_PASSWORD="CiSmoke-$RANDOM-Passphrase-$(date +%s)"  # must not contain the e-mail name
          docker compose -f infra/compose.yaml exec -T -e DFIR_ADMIN_PASSWORD api \
            python -m app.cli create-admin --email ci-admin@dfirbench.test
          python3 scripts/phase1-smoke.py --admin-email ci-admin@dfirbench.test
          # Phase 2: real API -> Redis -> Celery worker (parse queue) -> events -> timeline.
          python3 scripts/phase2-smoke.py --admin-email ci-admin@dfirbench.test
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose.yaml down -v
