name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: dfirbench
          POSTGRES_USER: dfir
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dfir -d dfirbench"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://dfir:ci_test_password@127.0.0.1:5432/dfirbench
      TEST_DATABASE_URL: postgresql+psycopg://dfir:ci_test_password@127.0.0.1:5432/dfirbench
      REDIS_URL: redis://127.0.0.1:6379/0
      # MinIO for the Object Lock vault integration tests (they skip if it is unreachable).
      S3_ENDPOINT: 127.0.0.1:9000
      S3_ACCESS_KEY: dfir
      S3_SECRET_KEY: ci_minio_password
    steps:
      - uses: actions/checkout@v5
      - name: Start MinIO
        # Service containers cannot pass `server /data`, so run it directly.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dfir -e MINIO_ROOT_PASSWORD=ci_minio_password \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Bandit
        run: bandit -c pyproject.toml -r app -q
      - name: Alembic upgrade + drift check
        run: alembic upgrade head && alembic check
      - name: Pytest (unit + integration)
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: AI eval (offline, fixtures; no LLM, no network)
        run: python -m app.ai.eval --out ai-eval-report.json

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend, frontend]
    env:
      # Phase 7/9/10 smokes: offline AI and enrichment, outbound only to the api container,
      # metrics on, a low refresh limit the Phase 10 smoke can reach (login limit high).
      ENABLE_AI: "true"
      LLM_PROVIDER: fake
      ENABLE_ENRICHMENT: "true"
      ENRICHMENT_FAKE: "true"
      OUTBOUND_ALLOW_HTTP: "true"
      OUTBOUND_ALLOW_HOSTS: api
      AUTH_RATE_LIMIT_PER_MINUTE: "1000"
      AUTH_REFRESH_RATE_LIMIT_PER_MINUTE: "40"
    steps:
      - uses: actions/checkout@v5
      - name: Metrics token for this run
        run: echo "METRICS_TOKEN=ci-metrics-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Build and start the stack
        run: docker compose -f infra/compose.yaml up -d --build
      - name: Wait for healthy services
        run: bash scripts/wait-healthy.sh 300
      - name: Probe endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/api/v1/ready
          curl -fsS http://127.0.0.1:8080/api/v1/health
      - name: Phase 1-3, 7, 9 and 10 live smokes
        run: |
          export DFIR_ADMIN_PASSWORD="CiSmoke-$RANDOM-Passphrase-$(date +%s)"  # must not contain the e-mail name
          docker compose -f infra/compose.yaml exec -T -e DFIR_ADMIN_PASSWORD api \
            python -m app.cli create-admin --email ci-admin@dfirbench.test
          python3 scripts/phase1-smoke.py --admin-email ci-admin@dfirbench.test
          # Phase 2: real API -> Redis -> Celery worker -> parser sandbox -> events -> timeline.
          python3 scripts/phase2-smoke.py --admin-email ci-admin@dfirbench.test
          # Phase 3: parse -> automatic detection (detect queue) -> alerts, lifecycle, IOC match.
          python3 scripts/phase3-smoke.py --admin-email ci-admin@dfirbench.test
          # Phase 7: AI features with the offline provider (citations, injection handling).
          python3 scripts/phase7-smoke.py --admin-email ci-admin@dfirbench.test
          # Phase 9: playbooks, four eyes, signed webhooks to a receiver in the api container.
          python3 scripts/phase9-smoke.py --admin-email ci-admin@dfirbench.test
          # Phase 10: sandbox container properties, sandboxed jobs, app login, metrics, limits.
          python3 scripts/phase10-smoke.py --admin-email ci-admin@dfirbench.test
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose.yaml down -v

  security:
    # Phase 10 scans (scripts/scan.sh, docs/hardening.md): gitleaks over the history, pip-audit,
    # npm audit, Trivy on the api and worker images (gate: fixable CRITICAL in language
    # packages), CycloneDX SBOMs as artifacts.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks scans every commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend environment (the dependency set pip-audit checks)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -e "backend[dev]"
      - name: Frontend dependencies
        run: cd frontend && npm ci
      - name: Build the api and worker images
        run: docker compose -f infra/compose.yaml build api worker
      - name: Scans
        run: bash scripts/scan.sh
      - name: SBOMs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            var/scan/*.json
            var/scan/*.txt
          if-no-files-found: warn
